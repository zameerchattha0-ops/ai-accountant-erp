[pytest]
# The test suite lives in app/tests.  scripts/ holds operator tooling and
# diagnostics (e.g. hero_headline_contrast.py) whose extra dependencies
# (Pillow) are NOT part of requirements.txt — collecting them would break a
# plain `pytest` run for no benefit.
testpaths = app/tests
markers =
    allows_db: opt a genuine integration test out of the no-live-database guard in app/tests/conftest.py (point it at a DISPOSABLE project, never production).
